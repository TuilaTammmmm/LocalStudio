[package]
name = "local-ai-studio"
version = "0.1.0"
description = "LocalAI Desktop Studio - Native Desktop App"
edition = "2021"

[lib]
name = "local_ai_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[features]
default = ["devtools"]
devtools = []

[dependencies]
tauri = { version = "2.0", features = ["devtools"] }
tauri-plugin-shell = "2.0"
tauri-plugin-process = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
