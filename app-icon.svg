<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Soft Outer Border -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="#0b0f17" />
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" fill-opacity="0.25" stroke="#38bdf8" stroke-width="8" stroke-opacity="0.4" />

  <!-- Inner Ambient Glow Circle -->
  <circle cx="256" cy="256" r="150" fill="#38bdf8" fill-opacity="0.15" filter="url(#glow)" />

  <!-- Local AI Lightning Bolt Symbol -->
  <path d="M 280 64 L 140 280 L 250 280 L 220 448 L 380 220 L 270 220 Z"
        fill="url(#boltGrad)"
        filter="url(#glow)"
        stroke="#ffffff"
        stroke-width="6"
        stroke-linejoin="round" />
</svg>